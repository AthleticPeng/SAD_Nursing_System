services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:3000
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://nursing:nursing_password@db:5432/nursing_db
      PATIENT_DATA_PATH: /app/database/病人模擬資料.json
    volumes:
      - ./database:/app/database:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nursing
      POSTGRES_PASSWORD: nursing_password
      POSTGRES_DB: nursing_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nursing -d nursing_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
